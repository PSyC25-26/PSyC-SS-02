name: CI Banca Online

on:
  push:
    branches:
      - '**' # Se ejecutará en todas las ramas
    workflow_dispatch:
      #para ejecutarlo en horas especificas:
  # schedule:
  #   - cron: '0 18-23/2 * * *'  # 20:00–01:00 CET
  #   - cron: '0 0-6/2 * * *'    # 02:00–08:00 CET

# Permisos necesarios para publicar en GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # 1. Configuración del servicio de Base de Datos
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: banca_online
          MYSQL_USER: banca_user
          MYSQL_PASSWORD: mi_password
        ports:
        
          # Mapeamos el puerto 3306 del contenedor al 3307 de la máquina
          - 3307:3306 
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar JDK
        uses: actions/setup-java@v4
        with:
          java-version: '25' 
          distribution: 'temurin'

      - name: Caché de dependencias Maven
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Instalar Doxygen y Graphviz
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen graphviz

      - name: Esperar a que MySQL esté listo
        run: |
          echo "Esperando a MySQL..."
          until mysqladmin ping -h 127.0.0.1 -P 3307 -uroot -proot --silent; do
            sleep 2
          done

      # spring.sql.init.mode=always y schema.sql en el properties.
      # Por lo tanto, no se necesita inyectar el SQL a mano.

      - name: Compilar y ejecutar Tests
        working-directory: ./banca-online
        # "verify" compila, pasa los tests y además activa Jacoco
        run: mvn clean verify 

      # ==============================================================================
      # ANÁLISIS DE CALIDAD DE CÓDIGO CON SONARCLOUD
      # ==============================================================================
      # Este paso lee los resultados de los tests y envía el análisis a SonarCloud.
      - name: Analizar código con SonarCloud
        working-directory: ./banca-online
        env:
          # El token de seguridad que guardaste en los Secrets de GitHub
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          mvn org.sonarsource.scanner.maven:sonar-maven-plugin:sonar 
          -Dsonar.projectKey=PSyC25-26_PSyC-SS-02
          -Dsonar.organization=psyc25-26
          -Dsonar.host.url=https://sonarcloud.io 
          -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

      # ======================================================
      # TESTS END-TO-END (E2E) CON PLAYWRIGHT
      # ======================================================
      - name: Configurar Node.js y Caché de NPM
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './playwright-tests/package-lock.json'

      - name: Instalar dependencias de Playwright
        working-directory: ./playwright-tests
        run: npm ci

      # --- INICIO BLOQUE OPTIMIZACIÓN (Caché de Navegadores) ---
      - name: Obtener versión de Playwright instalada
        id: playwright-version
        working-directory: ./playwright-tests
        run: echo "version=$(npm ls @playwright/test | grep @playwright/test | awk '{print $2}')" >> $GITHUB_OUTPUT

      - name: Restaurar caché de navegadores Playwright
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}

      - name: Instalar navegadores de Playwright (solo si no hay caché)
        working-directory: ./playwright-tests
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps
      # --- FIN BLOQUE OPTIMIZACIÓN ---

      - name: Iniciar servidor Spring Boot en segundo plano
        working-directory: ./banca-online
        run: |
          nohup mvn spring-boot:run > spring-boot.log 2>&1 &
          echo "Esperando a que Spring Boot arranque en el puerto 8080..."
          while ! curl -s http://localhost:8080 > /dev/null; do sleep 5; done
          echo "¡Spring Boot arrancado y listo!"

      - name: Ejecutar tests de Playwright
        working-directory: ./playwright-tests
        run: npm test

      # --- INICIO BLOQUE DE DEPURACIÓN VISUAL ---
      - name: Subir reporte HTML de Playwright
        uses: actions/upload-artifact@v4
        # El if: always() garantiza que el reporte se suba incluso si los tests fallan
        if: always()
        with:
          name: playwright-report
          path: playwright-tests/playwright-report/
          retention-days: 7

      - name: Generar Maven Site (Reportes de Tests/Jacoco)
        working-directory: ./banca-online
        run: mvn site

      - name: Generar Documentación Doxygen
        working-directory: ./banca-online
        run: doxygen Doxyfile
      
      # --- PREPARACIÓN Y DESPLIEGUE ---
      
      - name: Preparar carpeta para Pages
        run: |
          mkdir public
          # Copiamos reportes de Maven
          cp -r banca-online/target/site public/maven-site

          # Copiamos ContiPerf
          if [ -d "banca-online/target/contiperf-report" ]; then
            cp -r banca-online/target/contiperf-report public/maven-site/contiperf-report
          fi

          # Copiamos Doxygen
          if [ -d "banca-online/docs/doxygen/html" ]; then
            cp -r banca-online/docs/doxygen/html public/doxygen
          fi

          # Index de navegación
          echo "<html><body><h1>Reportes CI - Banca Online</h1><ul>" > public/index.html
          echo "<li><a href='./maven-site/index.html'>Maven Site (Tests y Cobertura)</a></li>" >> public/index.html
          echo "<li><a href='./doxygen/index.html'>Documentación Doxygen</a></li>" >> public/index.html
          echo "<li><a href='./maven-site/contiperf-report/index.html'>Reporte de Rendimiento (ContiPerf)</a></li>" >> public/index.html
          echo "</ul></body></html>" >> public/index.html

      - name: Configurar Pages
        uses: actions/configure-pages@v4

      - name: Subir artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # ========================================================================
      # GENERACIÓN Y ALMACENAMIENTO DE ARTEFACTOS (EJECUTABLE)
      # ========================================================================
      # En este paso final, le pedimos a GitHub Actions que tome el archivo .jar 
      # generado por el proceso de compilación de Maven (paso 'verify') y lo guarde 
      # de forma segura en los servidores de GitHub.
     
      - name: Subir artefacto JAR de la aplicación (Ejecutable)
        # Utilizamos la acción oficial de GitHub para subir artefactos (versión 4)
        uses: actions/upload-artifact@v4
        with:
         
          name: banca-online-ejecutable
          
          path: banca-online/target/*.jar
          
          retention-days: 7

     





