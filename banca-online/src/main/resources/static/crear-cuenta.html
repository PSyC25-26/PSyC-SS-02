<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banca Online - Gestión de Cuentas</title>
    <link rel="stylesheet" href="css/estilo.css">
</head>

<body>
<main>
    <div class="container">
        <h1>Gestión de Cuentas</h1>

        <!-- Botón para abrir el formulario: AÑADIR CUENTA -->
        <button class="btn-primario" id="btnAbrir">
            Nueva Cuenta
        </button>

        <!-- Formulario creación de cuenta -->
        <div id="miForm" class="form">
            <div class="form-contenido">

                <!-- HEADER -->
                <div class="form-header">
                    <h2>Crear Nueva Cuenta</h2>
                    <button class="btn-cerrar" id="btnCerrar">&times;</button>
                </div>

                <!-- FORMULARIO -->
                <form id="formCuenta">
                    <div class="form-group">
                        <label for="clienteId">ID del Cliente *</label>
                        <input type="number" id="clienteId" name="clienteId"
                               required min="1"
                               placeholder="Ingrese el ID del cliente">
                    </div>

                    <div class="form-group">
                        <label for="tipoCuenta">Tipo de Cuenta *</label>
                        <select id="tipoCuenta" name="tipoCuenta" required
                                style="width:100%; padding:10px; border:1px solid #ddd;
                                       border-radius:5px; font-size:14px;">
                            <option value="">-- Selecciona un tipo --</option>
                            <option value="CORRIENTE">Corriente</option>
                            <option value="AHORRO">Ahorro</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="saldoInicial">Saldo Inicial (€)</label>
                        <input type="number" id="saldoInicial" name="saldoInicial"
                               min="0" step="0.01"
                               placeholder="0.00">
                    </div>

                    <!-- FOOTER -->
                    <div class="form-footer">
                        <button type="button" class="btn-secundario" id="btnCancelar">
                            Cancelar
                        </button>
                        <button type="submit" class="btn-primario" id="btnGuardar">
                            Guardar Cuenta
                        </button>
                    </div>
                </form>

                <!-- Mensajes de éxito/error -->
                <div id="mensajeExito" class="mensaje-exito" style="display: none;">
                    ¡Cuenta creada con éxito!
                </div>
                <div id="mensajeError" class="mensaje-error" style="display: none;">
                    Error al crear la cuenta. Inténtelo de nuevo por favor.
                </div>
            </div>
        </div>

        <!-- Lista de cuentas -->
        <div class="lista">
            <h3>Cuentas Registradas</h3>
            <div id="listaCuentas">
                <p>Cargando cuentas...</p>
            </div>
        </div>
    </div>
</main>

<script src="js/cuenta.js"></script>
</body>
</html>
