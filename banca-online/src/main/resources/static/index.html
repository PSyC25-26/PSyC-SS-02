<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Banco Digital</title>
  <link rel="stylesheet" href="css/estilo.css">

  <!-- Estilos modulares -->
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/componentes.css">
  <link rel="stylesheet" href="css/modales.css">
  <link rel="stylesheet" href="css/admin.css">
  <link rel="stylesheet" href="css/cliente.css">

</head>
<body>

<!-- Pantalla de Login (inicial) -->
<div id="loginScreen" class="container">
  <div class="card">
    <h2>🏦 Banca Online</h2>

    <!-- Formulario login-->
    <form id="loginForm">
      <!--Correo-->
      <div class="form-group">
        <label>Correo electrónico</label>
        <input type="email" id="loginEmail" required>
      </div>

      <!--Contrasena-->
      <div class="form-group">
        <label>Contraseña</label>
        <input type="password" id="loginPassword" required>
      </div>

      <!--Boton-->
      <button type="submit" class="btn-primario">Iniciar sesión</button>
      <div id="loginError" class="mensaje-error" style="display: none;"></div>
    </form>
  </div>
</div>

<!-- Panel principal (se muestra tras login) -->
<div id="mainApp" style="display: none;">
  <div class="container">
    <h1>🏦 Banco Digital</h1>
    <div>
      <span id="userRole"></span>
      <button id="btnMiPerfilSuperior" class="btn-perfil-top" style="display:none;">👤 Mi Perfil</button>
      <button id="logoutBtn" class="btn-secundario">Cerrar sesión</button>

    </div>

    <!-- Menú dinámico (se llena con JS) -->
    <div id="menuDinamico" class="lista">
      <!-- Los botones se generan aquí -->
    </div>

    <div id="modalContainer"></div>
    <!-- Contenido del modal -->
  </div>
</div>

<script src="js/auth.js"></script>
<script src="js/modales.js"></script>
<script src="js/app.js"></script>
</body>
</html>
