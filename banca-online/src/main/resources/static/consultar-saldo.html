<!DOCTYPE html>
<html lang="es">
<head>
    <title>Consulta de Saldo</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
<div class="card">
    <h2>Consultar saldo</h2>

    <!-- Formulario -->
    <form id="formSaldo">
        <label for="cuentaId">ID de la cuenta:</label>
        <input type="number" id="cuentaId" placeholder="Introduce ID de cuenta" min="1" required />
        <button type="submit">Consultar</button>
    </form>

    <!-- Mensajes -->
    <div id="mensajeExito" class="mensajeExito" style="display:none;"></div>
    <div id="mensajeError" class="mensajeError" style="display:none;"></div>

    <!-- Saldo mostrado -->
    <div id="saldoMostrado" class="saldoMostrado"></div>
</div>

<!-- Scripts -->
<script src="/js/servicios/cuenta.js"></script>
<script src="/js/servicios/saldo.js"></script>
</body>
</html>
