<!DOCTYPE html>
<html lang="es">
<head>
    <title>Consulta de Saldo</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/estilo.css">
</head>


<body>
<div class="card">
    <h2>Consultar saldo</h2>

    <form id="formSaldo">
        <input type="number" id="cuentaId" placeholder="Introduce ID de cuenta" />

    <div id="mensajeExito" class="mensajeExito" style="display:none;"></div>
    <div id="mensajeError" class="mensajeError" style="display:none;"></div>

    <div id="saldoMostrado" class="saldoMostrado"></div>
</div>

<script src="/js/cuenta.js"></script>
<script src="/js/saldo.js"></script> <!-- vamos a crear este -->
