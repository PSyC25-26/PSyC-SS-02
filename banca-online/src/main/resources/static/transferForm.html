<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transferencia</title>
    <link rel="stylesheet" href="css/transferStyle.css">
</head>
<body>

    <div class="container">
        <h2>Nueva Transferencia</h2>

        <form id="formTransferencia">
            <label>Cuenta Origen:</label><br>
            <input type="text" id="cuentaOrigen"><br>

            <label>Cuenta Destino:</label><br>
            <input type="text" id="cuentaDestino"><br>

            <label>Importe (€):</label><br>
            <input type="number" id="cantidad"><br>

            <button type="button" id="btnLimpiar">Limpiar</button>
            <button type="submit" id="btnTransferir">
                <span id="btnTexto">Realizar Transferencia</span>
            </button>
        </form>

        <div id="mensajeTransferencia" class="mensaje-transferencia"></div>

        <div id="resumenTransferencia" class="resumen-transferencia">
            <h4>Transferencia realizada</h4>
            <p><strong>Origen:</strong> <span id="resumenOrigen"></span></p>
            <p><strong>Destino:</strong> <span id="resumenDestino"></span></p>
            <p><strong>Importe:</strong> <span id="resumenCantidad"></span></p>
        </div>
    </div>

    <script src="js/servicios/transferencia.js"></script>

</body>
</html>
