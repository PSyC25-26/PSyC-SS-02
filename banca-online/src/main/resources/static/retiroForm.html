<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Realizar Retiro - Banca Online</title>
    <link rel="stylesheet" href="css/estilo.css">
</head>
<body>

<div class="card">
    <h2>Realizar Retiro</h2>

    <form id="formRetiro">
        <label for="cuentaId">ID de la Cuenta Origen:</label>
        <input type="number" id="cuentaId" name="cuentaId" placeholder="Ej: 1" required>

        <label for="monto">Monto a retirar (€):</label>
        <input type="number" id="monto" name="monto" step="0.01" min="0.01" placeholder="Ej: 20.00" required>

        <button type="submit" id="btnRetirar">Retirar Dinero</button>
    </form>

    <div id="mensajeExito" style="display: none;"></div>
    <div id="mensajeError" style="display: none;"></div>
</div>

<script src="js/servicios/retiro.js"></script>

</body>
</html>
