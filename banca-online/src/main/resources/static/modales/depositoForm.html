<!-- Formulario de depósito -->
<!-- Información de la cuenta -->
<div id="infoCuentaDeposito" style="margin-bottom: 20px; padding: 15px; background: #f0f4f8; border-radius: 8px;">
    <p><strong>Cuenta:</strong> <span id="cuentaNumeroDeposito"></span></p>
    <p><strong>Saldo actual:</strong> <span id="cuentaSaldoDeposito"></span> €</p>
</div>

<form id="formDepositoForm">
    <div class="form-group">
        <label for="montoDeposito">Monto a Depositar (€) *</label>
        <input type="number" id="montoDeposito" name="monto" required
               min="0.01" step="0.01" placeholder="0.00">
    </div>

    <div class="form-footer">
        <button type="button" class="btn-secundario" id="btnCancelarDepositoForm">Cancelar</button>
        <button type="submit" class="btn-primario">Confirmar Depósito</button>
    </div>
</form>

<div id="mensajeExitoDepositoForm" class="mensaje-exito" style="display: none;"></div>
<div id="mensajeErrorDepositoForm" class="mensaje-error" style="display: none;"></div>
