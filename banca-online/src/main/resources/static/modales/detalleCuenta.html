<!-- Detalle de la cuenta seleccionada -->
<div class="form-contenido">
    <!-- Información de la cuenta -->
    <div id="infoCuentaDetalle" style="margin-bottom: 25px; padding: 20px; background: #f0f4f8; border-radius: 10px;">
      <div class="detalle-row">
        <span class="detalle-label">Número de Cuenta:</span>
        <span class="detalle-valor" id="detalleNumeroCuenta"></span>
      </div>
      <div class="detalle-row">
        <span class="detalle-label">Tipo de Cuenta:</span>
        <span class="detalle-valor" id="detalleTipoCuenta"></span>
      </div>
      <div class="detalle-row">
        <span class="detalle-label">Saldo Actual:</span>
        <span class="detalle-valor" id="detalleSaldoCuenta"></span>
      </div>
      <div class="detalle-row">
        <span class="detalle-label">Fecha de Creación:</span>
        <span class="detalle-valor" id="detalleFechaCreacion"></span>
      </div>
    </div>

    <!-- Botones de operaciones -->
    <h3 style="margin-bottom: 15px;">Operaciones</h3>
    <div class="acciones-operaciones">
      <button class="btn-depositar-detalle" id="btnDepositarDetalle">💵 Depositar</button>
      <button class="btn-retirar-detalle" id="btnRetirarDetalle">💸 Retirar</button>
      <button class="btn-transferir-detalle" id="btnTransferirDetalle">🔄 Transferir</button>
    </div>

    <!-- Mensajes -->
    <div id="mensajeExitoDetalle" class="mensaje-exito" style="display: none;"></div>
    <div id="mensajeErrorDetalle" class="mensaje-error" style="display: none;"></div>
</div>
