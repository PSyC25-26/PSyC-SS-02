<div class="form-contenido">
  <div class="form-scroll">
    <div id="seccionVistaPerfil">
      <div class="form-group">
        <label>Nombre y Apellidos</label>
        <div id="verNombre" class="dato-lectura" style="padding: 12px; background: #f8f9fa; border: 1px solid #eee; border-radius: 6px; font-weight: 500;">Cargando...</div>
      </div>
      <div class="form-group">
        <label>DNI</label>
        <div id="verDni" class="dato-lectura" style="padding: 12px; background: #f8f9fa; border: 1px solid #eee; border-radius: 6px;">Cargando...</div>
      </div>
      <div class="form-group">
        <label>Email</label>
        <div id="verEmail" class="dato-lectura" style="padding: 12px; background: #f8f9fa; border: 1px solid #eee; border-radius: 6px;">Cargando...</div>
      </div>
      <div class="form-group">
        <label>Teléfono Actual</label>
        <div id="verTelefono" class="dato-lectura" style="padding: 12px; background: #f8f9fa; border: 1px solid #eee; border-radius: 6px;">Cargando...</div>
      </div>
      <div class="form-group">
        <label>Dirección Actual</label>
        <div id="verDireccion" class="dato-lectura" style="padding: 12px; background: #f8f9fa; border: 1px solid #eee; border-radius: 6px;">Cargando...</div>
      </div>

      <div class="form-footer">
        <button type="button" class="btn-primario" id="btnIrAEditar">✏️ Actualizar Datos</button>
        <button type="button" class="btn-secundario" onclick="GestorModales.cerrar('editarPerfil')">Cerrar</button>
      </div>
    </div>

    <form id="formEditarPerfil" style="display: none;">
      <div class="form-header">
        <h2>✏️ Editar Mis Datos Personales</h2>
        <button class="btn-cerrar" onclick="GestorModales.cerrar('editarPerfil')">&times;</button>
      </div>
      <p style="color: #666; font-size: 0.9rem; margin-bottom: 15px;">Modifica los campos que desees actualizar. Si dejas uno vacío, se mantendrá el actual.</p>

      <div class="form-group">
        <label for="perfilTelefono">Nuevo Teléfono</label>
        <input type="tel" id="perfilTelefono" placeholder="Escribe el nuevo teléfono">
      </div>

      <div class="form-group">
        <label for="perfilDireccion">Nueva Dirección</label>
        <input type="text" id="perfilDireccion" placeholder="Escribe la nueva dirección">
      </div>

      <div class="form-footer">
        <button type="button" class="btn-secundario" id="btnCancelarEdicion">Atrás</button>
        <button type="submit" class="btn-primario" id="btnGuardarCambios">Guardar Cambios</button>
      </div>
    </form>

    <div id="mensajeExitoPerfil" class="mensaje-exito" style="display: none; margin-top: 15px; padding: 10px; background: #d4edda; color: #155724; border-radius: 4px; border: 1px solid #c3e6cb;"></div>
    <div id="mensajeErrorPerfil" class="mensaje-error" style="display: none; margin-top: 15px; padding: 10px; background: #f8d7da; color: #721c24; border-radius: 4px; border: 1px solid #f5c6cb;"></div>
  </div>
</div>
