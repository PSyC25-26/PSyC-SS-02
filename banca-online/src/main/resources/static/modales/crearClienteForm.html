<div id="miForm">
    <div class="form-contenido">
            <!-- FORMULARIO -->
            <form id="formCliente">
                <div class="form-group">
                    <label for="nombre">Nombre *</label>
                    <input type="text" id="nombre" name="nombre" required placeholder="Ingrese el nombre">
                </div>

                <div class="form-group">
                    <label for="primerApellido">Primer Apellido</label>
                    <input type="text" id="primerApellido" name="primerApellido" placeholder="Ingrese el primer apellido">
                </div>

                <div class="form-group">
                    <label for="segundoApellido">Segundo Apellido</label>
                    <input type="text" id="segundoApellido" name="segundoApellido" placeholder="Ingrese el segundo apellido">
                </div>

                <div class="form-group">
                    <label for="dni">DNI *</label>
                    <input type="text" id="dni" name="dni" placeholder="12345678A" required>
                </div>

                <div class="form-group">
                    <label for="email">Email *</label>
                    <input type="email" id="email" name="email" required placeholder="ejemplo@gmail.com">
                </div>

                <div class="form-group">
                    <label for="password">Contraseña *</label>
                    <input type="password" id="password" name="password" required placeholder="Contraseña de acceso al portal">
                </div>

                <div class="form-group">
                    <label for="telefono">Teléfono</label>
                    <input type="tel" id="telefono" name="tlf" minlength="8" placeholder="Ingrese el número de teléfono">
                </div>

                <div class="form-group">
                    <label for="fechaNacimiento">Fecha de Nacimiento *</label>
                    <input type="date" id="fechaNacimiento" name="fechaNacimiento" required>
                </div>

                <div class="form-group">
                    <label for="direccion">Dirección</label>
                    <input type="text" id="direccion" name="direccion">
                </div>

                <div class="form-footer">
                    <button type="button" class="btn-secundario" id="btnCancelar">Cancelar</button>
                    <button type="submit" class="btn-primario" id="btnGuardar">Guardar Cliente</button>
                </div>
            </form>

            <div id="mensajeExito" class="mensaje-exito" style="display: none;">✅ ¡Cliente creado con éxito!</div>
            <div id="mensajeError" class="mensaje-error" style="display: none;">❌ Error al crear el cliente.</div>
    </div>
</div>
