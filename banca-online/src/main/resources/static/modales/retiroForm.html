<div id="infoCuentaRetiro" style="margin-bottom: 20px; padding: 15px; background: #f0f4f8; border-radius: 8px;">
    <p><strong>Cuenta:</strong> <span id="cuentaNumeroRetiro"></span></p>
    <p><strong>Saldo disponible:</strong> <span id="cuentaSaldoRetiro"></span> €</p>
</div>

<form id="formRetiro">
    <div class="form-group">
        <label for="montoRetiro">Monto a Retirar (€) *</label>
        <input type="number" id="montoRetiro" name="monto" required
               min="0.01" step="0.01" placeholder="0.00">
    </div>

    <div class="form-footer">
        <button type="button" class="btn-secundario" id="btnCancelarRetiro">Cancelar</button>
        <button type="submit" class="btn-primario">Confirmar Retiro</button>
    </div>
</form>

<div id="mensajeExitoRetiro" class="mensaje-exito" style="display: none;"></div>
<div id="mensajeErrorRetiro" class="mensaje-error" style="display: none;"></div>
