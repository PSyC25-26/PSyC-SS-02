<div id="miForm">
    <div class="form-contenido">
        <div style="text-align: center; padding: 20px;">
            <p>¿Estás seguro de que deseas <strong>desactivar</strong> la siguiente cuenta?</p>
            <div id="infoCuentaEliminar" class="card-info" style="background: #f8f9fa; padding: 15px; margin: 20px 0; border-radius: 8px; border-left: 4px solid #dc3545;">
            </div>
            <p class="text-ayuda" style="font-size: 0.9em; color: #666;">
                ⚠️ Nota: Solo se pueden desactivar cuentas con <strong>saldo 0.00€</strong>.
            </p>
        </div>

        <div class="form-footer">
            <button type="button" class="btn-secundario" id="btnCancelarEliminar">Cancelar</button>
            <button type="button" class="btn-danger" id="btnConfirmarEliminar">Confirmar Desactivación</button>
        </div>

        <div id="mensajeExitoEliminar" class="mensaje-exito" style="display: none;"></div>
        <div id="mensajeErrorEliminar" class="mensaje-error" style="display: none;"></div>
    </div>
</div>
