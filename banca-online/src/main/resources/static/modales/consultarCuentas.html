<div class="form-contenido">
    <div class="form-header">
        <h2>🔍 Consultar Cuentas</h2>
        <button class="btn-cerrar" id="btnCerrarConsultarCuentas">&times;</button>
    </div>

    <div class="form-scroll">
        <form id="formBuscarCuentas">
            <div class="form-group">
                <label for="clienteId">ID del Cliente *</label>
                <input type="number" id="clienteIdBusqueda" name="clienteId" 
                       placeholder="Ingrese el ID del cliente" min="1" required>
            </div>
            <div class="form-footer">
                <button type="submit\" class="btn-primario">Buscar Cuentas</button>
            </div>
        </form>

        <div id="mensajeErrorCuentas" class="mensaje-error" style="display: none; margin-top: 15px;"></div>
        
        <div class="lista" id="listaCuentasContainer" style="display: none; margin-top: 20px;">
            <h3>Resultados:</h3>
            <div id="listaCuentasResultados">
                </div>
        </div>
    </div>
</div>
