<!-- Formulario consultar saldo -->
<div class="form-contenido">
    <div class="form-header">
        <h2>💰 Consultar Saldo</h2>
        <button class="btn-cerrar" id="btnCerrarConsultarSaldo">&times;</button>
    </div>

    <div class="form-scroll">
        <form id="formConsultarSaldo">
            <div class="form-group">
                <label for="cuentaNumero">Número de Cuenta *</label>
                <input type="text" id="cuentaNumero" name="cuentaNumero" required
                       placeholder="Ej: ES00 0000 0000 0000 0000 0000">
            </div>

            <div class="form-footer">
                <button type="button" class="btn-secundario" id="btnCancelarConsultarSaldo">Cancelar</button>
                <button type="submit" class="btn-primario">Consultar Saldo</button>
            </div>
        </form>

        <div id="mensajeExitoSaldo" class="mensaje-exito" style="display: none;"></div>
        <div id="mensajeErrorSaldo" class="mensaje-error" style="display: none;"></div>
        <div id="saldoMostrado" class="saldoMostrado" style="display: none;"></div>
    </div>
</div>
