spring.application.name=banca-online

# ============================================================================
# DATASOURCE - usa variables de entorno con valores por defecto
# Asi funciona igual en local (localhost:3307) que dentro de Docker (mysql:3306)
# ============================================================================
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:banca_online}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=${DB_USER:banca_user}
spring.datasource.password=${DB_PASSWORD:mi_password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================================================================
# JPA / Hibernate
# ============================================================================
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=none

# ============================================================================
# Inicializacion SQL - schema.sql y data.sql se ejecutan automaticamente
# ============================================================================
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql
spring.sql.init.continue-on-error=true

# ============================================================================
# Logging
# ============================================================================
logging.level.org.springframework.jdbc.datasource.init=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# ============================================================================
# JWT
# ============================================================================
app.jwt.secret=${JWT_SECRET:dGhpcytlc3R1bmErc2VjcmV0YStjbGF2ZSttdXkrbGFyZ2E=}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}