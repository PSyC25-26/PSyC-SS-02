# Configuracion para tests en Jenkins/CI
spring.datasource.url=jdbc:h2:mem:bancaonline;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.sql.init.mode=never

# JWT para tests
app.jwt.secret=dGVzdC1zZWNyZXQta2V5LXRoYXQtaXMtbG9uZy1lbm91Z2gtZm9yLWp3dC1oczI1NQo=
app.jwt.expiration-ms=86400000

# Desactivar Swagger en tests
springdoc.api-docs.enabled=false